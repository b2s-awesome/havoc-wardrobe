name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: havoc-wardrobe
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Diagnose 26.3 API names (only on failure)
        if: failure()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches/fabric-loom .gradle -type f -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/item/Items.class"; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -E "net/minecraft/world/inventory/[A-Za-z]*(Click|Input|Action)[A-Za-z]*\.class" | head -20
          javap -cp "$JAR" net.minecraft.world.inventory.AbstractContainerMenu | grep -iE "click|input" | head -20
          javap -cp "$JAR" net.minecraft.world.entity.player.Inventory | grep -iE "placeItemBack|add\(" | head -10
          unzip -l "$JAR" | grep -iE "Prediction" | head -5
          javap -cp "$JAR" net.minecraft.world.item.Items | grep -iE "stained_glass_pane|dye" | head -20
          javap -cp "$JAR" net.minecraft.world.item.Items | head -5
