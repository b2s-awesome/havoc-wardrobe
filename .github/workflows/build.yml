name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: havoc-wardrobe
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Diagnose 26.3 API names (only on failure)
        if: failure()
        run: |
          JAR=$(find ~/.gradle/caches .gradle -type f -name "*.jar" \( -path "*minecraft*" \) 2>/dev/null | grep -E "26\.3" | grep -viE "sources|fabric-api|loader" | xargs -r ls -S | head -1)
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -E "net/minecraft/world/inventory/[A-Za-z]*(Click|Input|Action)[A-Za-z]*\.class" | head -20
          javap -cp "$JAR" net.minecraft.world.inventory.AbstractContainerMenu | grep -iE "clicked|click|input" | head -20
          javap -cp "$JAR" net.minecraft.world.entity.player.Inventory | grep -iE "placeItemBack|add\(" | head -10
          unzip -l "$JAR" | grep -iE "Prediction" | head -5
          javap -cp "$JAR" net.minecraft.world.item.Items | grep -iE "stained_glass_pane|_dye|dye" | head -20
