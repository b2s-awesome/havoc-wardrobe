name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Print jar (base64) for verification
        run: |
          for f in build/libs/*.jar; do
            echo "JARFILE $(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)"
            echo "BEGIN-B64"; base64 -w0 "$f"; echo; echo "END-B64"
          done
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: havoc-wardrobe
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Diagnose 26.3 API names (only on failure)
        if: failure()
        run: |
          JAR=""
          for j in $(find ~/.gradle/caches/fabric-loom .gradle -type f -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/item/Items.class"; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          javap -cp "$JAR" net.minecraft.world.inventory.ContainerInput
          javap -cp "$JAR" net.minecraft.world.level.block.ColorCollection | head -30
          javap -cp "$JAR" net.minecraft.util.Prediction | head -20
